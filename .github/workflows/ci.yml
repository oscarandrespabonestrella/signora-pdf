name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: AI guide is complete and up to date
        run: npm run docs:ai:check

      - name: Unit tests
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Core must not bundle PDF engines
        run: |
          if grep -E "pdfjs-dist|pdf-lib" dist/signora-pdf/fesm2022/signora-pdf.mjs dist/signora-pdf/fesm2022/signora-pdf-ui.mjs dist/signora-pdf/fesm2022/signora-pdf-http.mjs; then
            echo "Core/UI bundles reference a PDF engine" && exit 1
          fi

      - name: Pack library
        run: npm pack ./dist/signora-pdf --pack-destination ./dist

      - uses: actions/upload-artifact@v4
        with:
          name: signora-pdf-package
          path: dist/*.tgz

      - name: Build playground
        run: npm run build:playground

      - name: Generate API reference
        run: npm run docs:api

      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/api
